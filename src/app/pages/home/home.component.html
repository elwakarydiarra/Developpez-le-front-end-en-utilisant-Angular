<div class="dashboard-container">
  <h2 class="dashboard-title">Medals per Country</h2>

  <div class="counters">
    <div class="counter-box">
      <p>Number of JOs</p>
      <span>{{ numberOfJOs }}</span>
    </div>
    <div class="counter-box">
      <p>Number of countries</p>
      <span>{{ numberOfCountries }}</span>
    </div>
  </div>

  <div class="chart-container">
    <canvas baseChart
            [data]="pieChartData"
            [labels]="pieChartLabels"
            [type]="pieChartType"
            [options]="pieChartOptions">
    </canvas>
  </div>
</div>
