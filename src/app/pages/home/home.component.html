<div class="home-container">

<div class="header">
  <h1>Médailles par pays</h1>
</div>
</div>

<div class="stats">
  <div class="card">Nombre de JOs <br><strong class="highlight">{{ totalJO }}</strong></div>
  <div class="card">Nombre de Pays <br><strong class="highlight">{{ totalCountries }}</strong></div>
</div>


<div class="pie-wrapper">
<ngx-charts-pie-chart
  *ngIf="countries.length > 0"
  [view]="view"
  [results]="countries"
  [tooltipText]="customTooltip"
  [scheme]="colorScheme"
  [labels]="true"
  [legend]="false"
  (select)="onSelect($event)">
</ngx-charts-pie-chart>
</div>
