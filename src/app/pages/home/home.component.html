<div class="header">Tableau des médailles</div>

<div class="stats">
  <div class="card">Jeux Olympiques : <strong>{{ totalJO }}</strong></div>
  <div class="card">Pays participants : <strong>{{ totalCountries }}</strong></div>
</div>

<div class="pie-wrapper">
<ngx-charts-pie-chart
  *ngIf="countries.length > 0"
  [view]="view"
  [results]="countries"
  [scheme]="colorScheme"
  [labels]="true"
  [legend]="true"
  (select)="onSelect($event)">
</ngx-charts-pie-chart>
</div>
<h2 style="text-align: center; margin-top: 40px;">Détails par pays</h2>

<div class="country-list">
  <button
    *ngFor="let c of countries"
    class="country-button"
    (click)="goToDetails(c.id)">
    {{ c.name }} – {{ c.value }} médailles
  </button>
</div>
