<!-- ✅ Conteneur principal -->
<div class="home-container">

  <!-- ✅ Titre -->
  <div class="header">
    <h1>Medals per Country</h1>
  </div>

  <!-- ⚠️ Message d'erreur si pas de connexion ou erreur API -->
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <!-- ✅ Statistiques globales -->
  <div class="stats">
    <div class="card">
      Number of JOs<br />
      <strong class="highlight">{{ totalJO }}</strong>
    </div>
    <div class="card">
      Number of countries<br />
      <strong class="highlight">{{ totalCountries }}</strong>
    </div>
  </div>

  <!-- ✅ Graphique camembert -->
  <div class="pie-wrapper">
    <ngx-charts-pie-chart
      *ngIf="countries.length > 0"
      [view]="view"
      [results]="countries"
      [tooltipText]="customTooltip"
      [scheme]="colorScheme"
      [labels]="true"
      [legend]="false"
      (select)="onSelect($event)">
    </ngx-charts-pie-chart>
  </div>

</div>
